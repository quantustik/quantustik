name: docs drift

# The manifests here are copies of what quantustik.com already serves, and a
# copy nobody checks goes stale silently — this one went six endpoints and four
# tools behind before anyone noticed. Report-only: it never rewrites the repo,
# so a red run is a prompt to run the sync script and review the diff.

on:
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare vendored artifacts against the live service
        run: python3 scripts/sync-from-live.py --check
